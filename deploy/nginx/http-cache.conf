# Include inside the top-level `http {}` block.
proxy_cache_path /var/cache/nginx/efootball-nexon levels=1:2 keys_zone=nexon_public:20m max_size=512m inactive=10m use_temp_path=off;

map $http_cookie $nexon_has_session {
    default 0;
    ~*(?:__Secure-|__Host-)?(?:next-auth|authjs)\.session-token 1;
}

map $http_authorization $nexon_has_authorization {
    default 1;
    ""      0;
}

map $http_upgrade $nexon_connection_upgrade {
    default upgrade;
    ""      "";
}

upstream efootball_nexon_app {
    server 127.0.0.1:3000;
    keepalive 64;
}
