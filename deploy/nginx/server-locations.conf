# Include inside the existing TLS `server {}` block.
location ~ ^/(?:|players|tournaments|ratings)/?$ {
    proxy_pass http://efootball_nexon_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_cache nexon_public;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_bypass $nexon_has_session $nexon_has_authorization;
    proxy_no_cache $nexon_has_session $nexon_has_authorization $upstream_http_set_cookie;
    proxy_cache_valid 200 10s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    add_header X-Nexon-Cache $upstream_cache_status always;
}

location / {
    proxy_pass http://efootball_nexon_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nexon_connection_upgrade;
}
